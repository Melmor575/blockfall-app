<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLOCKFALL - Compañero Digital</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #161f33;
      --accent-color: #00e5ff;
      --text-color: #e0e6ed;
      --gold: #ffb703;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 500px;
      width: 100%;
      background: var(--card-bg);
      border: 2px solid var(--accent-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
      box-sizing: border-box;
    }
    h1 {
      text-align: center;
      color: var(--accent-color);
      margin-top: 0;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .level-select {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    button {
      background: #22304d;
      color: var(--text-color);
      border: 1px solid var(--accent-color);
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover, button.active {
      background: var(--accent-color);
      color: #000;
      box-shadow: 0 0 10px var(--accent-color);
    }
    .display-box {
      background: #0d1424;
      border: 1px solid #2d3e63;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .result-title {
      font-size: 0.9em;
      color: #8899a6;
      margin-bottom: 5px;
    }
    .result-value {
      font-size: 1.4em;
      font-weight: bold;
      color: var(--gold);
    }
    .btn-action {
      width: 100%;
      padding: 15px;
      font-size: 1.1em;
      background: var(--gold);
      color: #000;
      border: none;
      margin-top: 10px;
    }
    .btn-action:hover {
      background: #ffa000;
      box-shadow: 0 0 12px var(--gold);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>BLOCKFALL</h1>
    <p style="text-align: center; font-size: 0.9em;">Selecciona o escanea el nivel de tu carta:</p>
    <div class="level-select">
      <button onclick="selectLevel(1)">NV. 1</button>
      <button onclick="selectLevel(2)">NV. 2</button>
      <button onclick="selectLevel(3)">NV. 3</button>
      <button onclick="selectLevel(4)">NV. 4</button>
      <button onclick="selectLevel(5)">NV. 5</button>
      <button onclick="selectLevel(6)">NV. 6</button>
      <button onclick="selectLevel(7)">NV. 7</button>
      <button onclick="selectLevel(8)">NV. 8</button>
    </div>
    <div class="display-box">
      <div class="result-title">Nivel Seleccionado</div>
      <div id="lvl-display" class="result-value">Ninguno</div>
    </div>
    <div class="display-box">
      <div class="result-title">Tramo de Fichas Necesario</div>
      <div id="tokens-display" class="result-value">-</div>
    </div>
    <button class="btn-action" onclick="resolveReward()">Resolver Recompensa</button>
    <div class="display-box" style="margin-top: 15px;">
      <div class="result-title">Resultado / Recompensa</div>
      <div id="reward-display" class="result-value">-</div>
    </div>
  </div>
  <script>
    const gameData = {
      1: { tokens: '1 Ficha', secrets: ['1 M$ (100%)'] },
      2: { tokens: '2 Fichas', secrets: ['2 M$', '3 M$'] },
      3: { tokens: '3 Fichas', secrets: ['3 M$', '4 M$', '5 M$'] },
      4: { tokens: '4 Fichas', secrets: ['4 M$', '5 M$', '6 M$', '7 M$'] },
      5: { tokens: '5 Fichas', secrets: ['5 M$', '6 M$', '7 M$', '8 M$', '9 M$'] },
      6: { tokens: '6 Fichas', secrets: ['6 M$', '7 M$', '8 M$', '9 M$', '10 M$'] },
      7: { tokens: '8 Fichas', secrets: ['8 M$', '9 M$', '10 M$', '11 M$'] },
      8: { tokens: '9 Fichas', secrets: ['9 M$', '10 M$', '11 M$', '12 M$'] }
    };
    let currentLevel = null;
    function selectLevel(lvl) {
      currentLevel = lvl;
      document.getElementById('lvl-display').innerText = 'Nivel ' + lvl;
      document.getElementById('tokens-display').innerText = gameData[lvl].tokens;
      document.getElementById('reward-display').innerText = 'Listo para resolver...';
    }
    function resolveReward() {
      if (!currentLevel) {
        alert('Por favor, selecciona primero un nivel de carta.');
        return;
      }
      const rewards = gameData[currentLevel].secrets;
      const finalReward = rewards[Math.floor(Math.random() * rewards.length)];
      document.getElementById('reward-display').innerText = finalReward;
    }
  </script>
</body>
</html>
